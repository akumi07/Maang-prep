<div style="background:#f6f6fb;padding:32px 16px;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:460px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e4e4f0">
    <div style="background:linear-gradient(120deg,#5b4fe0,#8b4fe0 45%,#e0518f);background-color:#5b4fe0;padding:22px 26px;color:#ffffff">
      <div style="font-size:18px;font-weight:bold">MAANG Prep</div>
    </div>
    <div style="padding:26px;color:#1a1b2e">
      <h1 style="font-size:20px;margin:0 0 10px">Reset your password</h1>
      <p style="margin:0 0 18px;color:#5f6380;font-size:15px;line-height:1.5">Enter this code on the password reset screen, then choose a new password.</p>
      <div style="font-size:34px;font-weight:bold;letter-spacing:10px;text-align:center;background:#eeedfd;color:#5b4fe0;border-radius:12px;padding:16px 0;font-family:'Courier New',monospace">{{ .Token }}</div>
      <p style="margin:18px 0 0;color:#5f6380;font-size:13px;line-height:1.5">This code expires in 10 minutes. If you didn't ask to reset your password, ignore this email; your password won't change.</p>
    </div>
  </div>
</div>
